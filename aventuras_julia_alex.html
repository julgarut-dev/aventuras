,happy:80,stars:{letters:0,music:0,math:0}};try{let s=JSON.parse(localStorage.getItem('alex-world-v2'));if(s)state={...state,...s}}catch(e){}function save(){try{localStorage.setItem('alex-world-v2',JSON.stringify(state))}catch(e){}$('coins').textContent='🪙 '+state.coins}save();let page='',round=0,lives=3,mode='',correct,locked=false,session=0;const names=['DO','RE','MI','FA','SOL','LA','SI','DO'];const freqs=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];let audio;function tone(i){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=freqs[i]||440;g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.45);o.start();o.stop(audio.currentTime+.5)}catch(e){}}function say(s){try{let u=new SpeechSynthesisUtterance(s);u.lang='es-ES';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}function esc(s){return String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}function pet(){return `\u003csvg class=\"pet\" id=\"pet\" viewBox=\"0 0 220 220\">\u003cellipse cx=\"110\" cy=\"198\" rx=\"77\" ry=\"12\" fill=\"#775a8050\"/>\u003cellipse cx=\"66\" cy=\"181\" rx=\"29\" ry=\"17\" fill=\"${state.color}\" stroke=\"#66548c\" stroke-width=\"3\"/>\u003cellipse cx=\"154\" cy=\"181\" rx=\"29\" ry=\"17\" fill=\"${state.color}\" stroke=\"#66548c\" stroke-width=\"3\"/>\u003cpath d=\"M32 142 Q18 100 57 57 Q65 16 110 29 Q154 16 163 57 Q202 100 188 142 Q180 188 110 190 Q40 188 32 142\" fill=\"${state.color}\" stroke=\"#66548c\" stroke-width=\"4\"/>\u003cellipse cx=\"110\" cy=\"155\" rx=\"48\" ry=\"28\" fill=\"#fff\" opacity=\".25\"/>\u003cellipse cx=\"77\" cy=\"100\" rx=\"25\" ry=\"31\" fill=\"white\"/>\u003cellipse cx=\"143\" cy=\"100\" rx=\"25\" ry=\"31\" fill=\"white\"/>\u003ccircle cx=\"82\" cy=\"104\" r=\"14\" fill=\"#34314c\"/>\u003ccircle cx=\"138\" cy=\"104\" r=\"14\" fill=\"#34314c\"/>\u003ccircle cx=\"87\" cy=\"98\" r=\"5\" fill=\"white\"/>\u003ccircle cx=\"143\" cy=\"98\" r=\"5\" fill=\"white\"/>\u003cellipse cx=\"54\" cy=\"133\" rx=\"14\" ry=\"8\" fill=\"#ff9bb7\"/>\u003cellipse cx=\"166\" cy=\"133\" rx=\"14\" ry=\"8\" fill=\"#ff9bb7\"/>\u003cpath d=\"M92 132 Q110 155 128 132\" fill=\"#633d65\"/>\u003ctext x=\"110\" y=\"49\" text-anchor=\"middle\" font-size=\"55\">${state.hat}\u003c/text>\u003c/svg>`}function go(p){session++;page=p;if(p==='map')map();if(p==='home')home();if(p==='shop')shop();if(p==='math'){main.innerHTML='\u003ch2>🌴 Selva matemática\u003c/h2>\u003ciframe title=\"Camaleones\" sandbox=\"allow-scripts allow-same-origin\" id=\"mathframe\">\u003c/iframe>';$('mathframe').srcdoc=MATH}if(p==='letters')menu('letters');if(p==='music')menu('music')}function map(){main.innerHTML=`\u003ch1>¡Hola, Álex!\u003c/h1>\u003cp>Elige tu próxima aventura\u003c/p>\u003cdiv class=\"map\">\u003csvg viewBox=\"0 0 900 540\" preserveAspectRatio=\"none\">\u003cdefs>\u003clinearGradient id=\"grass\" x2=\"0\" y2=\"1\">\u003cstop stop-color=\"#c9f38e\"/>\u003cstop offset=\"1\" stop-color=\"#79c98b\"/>\u003c/linearGradient>\u003c/defs>\u003cpath d=\"M70 120 Q140 10 350 45 Q470 5 620 60 Q850 30 850 230 Q910 420 720 480 Q540 550 380 475 Q110 550 55 340 Q0 210 70 120\" fill=\"#f7d99a\" stroke=\"#fff1c2\" stroke-width=\"15\"/>\u003cpath d=\"M75 120 Q140 25 350 60 Q470 20 620 75 Q830 45 835 230 Q880 410 710 465 Q540 530 380 460 Q130 530 70 330 Q15 210 75 120\" fill=\"url(#grass)\"/>\u003cpath d=\"M200 150 Q450 60 680 150 Q730 270 450 270 Q180 270 200 420 Q450 490 700 420\" stroke=\"#f9e7b4\" stroke-width=\"36\" fill=\"none\" stroke-linecap=\"round\" stroke-dasharray=\"2 2\"/>\u003cg fill=\"#fff\" opacity=\".45\">\u003cellipse cx=\"40\" cy=\"80\" rx=\"30\" ry=\"3\"/>\u003cellipse cx=\"850\" cy=\"90\" rx=\"30\" ry=\"3\"/>\u003cellipse cx=\"35\" cy=\"430\" rx=\"30\" ry=\"3\"/>\u003cellipse cx=\"870
